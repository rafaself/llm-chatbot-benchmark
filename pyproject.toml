[tool.ruff]
target-version = "py311"
line-length = 88
src = ["benchmark", "tests"]
exclude = [".venv", "node_modules", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["benchmark"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["benchmark", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
